;Better Flashlight NVSE config
;all keys autopopulated on first run
;external edits require restart; MCM changes dispatch the reload message in-game

[Main]
RenderEffects=1

[Flashlight]
;disable to turn the mod off entirely
Enabled=1

;light follows weapon when armed, otherwise camera
AttachToWeapon=1

;wrap lighting - lifts dark rims on alpha foliage (grass/trees) edges, but flattens the beam. 0 = off
SoftEdges=1

;when NewVegasReloaded is loaded, disable ITS flashlight so only this one renders. 1 = on (default)
DisableNVRFlashlight=1

;scene shadow pass - expensive, off by default (matches NVR)
;NOTE: shadow pass is stubbed in v1, this toggle currently has no effect
RenderShadows=0

;light cone
Angle=18.0
Distance=1800.0

;spot size scale - shrinks the pool (cone + cookie together). 1.0 = full Angle, lower = tighter
SpotSize=1.5

;near fade (game units) - dims the pool point-blank so a close wall doesn't blow out. 0 = off
NearFade=150

;caps only the added flashlight luminance, not the whole scene. 0 = off, higher = stronger hotspot reduction
HotspotLimit=1.0

;subtle reflector rings and unevenness in the projected beam. 0 = smooth/old behaviour
CookieStrength=0.25

;color (values above 1.0 are HDR). lower the warm bias (R,G) or raise B for a cooler beam
ColorR=2.0
ColorG=1.85
ColorB=1.65
Dimmer=1.0

;beam brightness (pre-tonemapping). lower = subtler, less blowout in dark scenes
Intensity=0.35

;sporadic flicker - mostly steady with occasional brief dips. 0 = off, higher = deeper/more often
Flicker=0.25

;warm-up ramp on toggle (seconds). incandescent feel. 0 = instant (LED)
WarmupTime=0.4

;position offset relative to attach point (weapon or camera)
OffsetX=0.0
OffsetY=0.0
OffsetZ=0.0

[EngineLight]
;live Gamebryo spotlight for material-aware surface lighting. Set Flashlight:Intensity=0 to isolate it.
Enabled=0
;multiplier applied to Flashlight:Dimmer for the engine light only
Dimmer=0.12
;specular colour multiplier copied from Flashlight colour
Specular=0.50
;raw NiPointLight attenuation terms. Defaults are intentionally conservative.
Atten0=1.0
Atten1=0.0
Atten2=0.000004

[MaterialLight]
;phase 1 material-aware route: bounded additive pass over vanilla static geometry
Enabled=1
Render=1
;brightness for the geometry material pass only. set to 0 to isolate the screen-space cone
Intensity=0.30
;shiny highlight strength for specular materials in the material pass
Specular=0.50
;minimum Blinn-Phong exponent for material highlights. higher = smaller, tighter highlights
SpecularPower=160.00
;visibility compensation for the separate specular term after cone, attenuation, and postprocessing
SpecularBoost=16.00
;normal-map perturbation multiplier for the material pass. 0 = vertex normals only, 1 = texture normal as-is
NormalStrength=2.50
;hard cap per frame for the test pass
MaxGeometry=2048
;0 = normal, 1 = paint all queued geometry red, 2 = cone-aware normal-map green / fallback blue, 3 = specular only, 4 = gloss input, 5 = half-vector shape, 6 = normal-map influence, 7 = masked specular lobe
DebugMode=0

[Volumetric]
;visible shaft of light in the air (single-scattering). all keys hot-reload live
Enabled=1

;per-view toggles (both still require Enabled=1)
FirstPersonEnabled=1
ThirdPersonEnabled=1
;overall beam brightness
Strength=5.0
;scattering anisotropy (0=even, ->1 strong forward glow). ~0.4-0.5 reads best side-on, higher when staring into the light
Anisotropy=0.45
;density falloff with height - higher = dust hugs the ground more
HeightFalloff=1.0
;how far the beam marches (game units), clamped to the nearest surface
MaxDistance=1500.0

;1st person shaft strength (0=off). the march uses a virtual light pushed off-camera
;so a beam is visible at all - lower values keep it from washing over the screen
FirstPersonStrength=0.15
;virtual light offset from the camera in 1st person (game units)
FirstPersonOffsetRight=8.0
FirstPersonOffsetDown=4.0

[Battery]
;drains while the Pip-Boy flashlight is on, recharges while off. Charge resets to full on load/new game.
Enabled=1
DrainRate=2.0
RechargeRate=2.5
;charge needed after full depletion before the flashlight can turn on again
RechargeThreshold=10.0
;HUD icon placement as a fraction of screen size
IconPosX=0.97
IconPosY=0.87
IconScale=0.6
;icon flashes when recovering after going below this charge
PulseThreshold=25.0
;0 = default, 1-4 = alternate texture sets
IconSet=2
